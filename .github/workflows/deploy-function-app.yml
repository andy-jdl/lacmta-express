name: Build and deploy Express project to Azure Function

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'lacmta-bp-function'
  AZURE_FUNCTIONAPP_PROJECT_PATH: '.'
  NODE_VERSION: '22'
  BUILD_ARTIFACT_NAME: 'relreased-package'
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_WEBHOOK_URL: ${{ secrets.TWILIO_WEBHOOK_URL }}
  SWIFTLY_API_KEY: ${{ secrets.SWIFTLY_API_KEY }}

jobs:
  build:
  runs-on: ubuntu-latest
  permissions:
    id-token: write
    contents: read
  defaults:
    run:
      shell: bash
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}
  steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v6
    
    - name: 'Set up node: ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
      
    - name: 'Install dependencies'
      run: npm ci
  
    - name: 'Upload artifact for deployment'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.BUILD_ARTIFACT_NAME }}
        path: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: 'Download artifact from build job'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: '${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}/downloaded-artifact'
     
      - name: 'Log in to Azure with AZ CLI'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        
      - name: 'Run the Azure Functions action'
        uses: Azure/functions-action@v1
        id: deploy-to-function-app
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}/downloaded-artifact' 